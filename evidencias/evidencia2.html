<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('Inter/Inter.ttf') format(truetype);
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('Inter/Inter.ttf') format(truetype);
            font-weight: 700;
            font-style: bold;
            font-display: swap;
        }
        
        *{margin: 0;
        padding: 0;}

        body{
            background-color: #DEDFE1;
            font-family: 'Inter';
        }

        .card {
            display: block;
            background-color: white;
            width: 600px;
            height: auto;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 4px 4px 5px 0px rgba(94,88,88,0.56);
            padding-bottom: 10px;
        }

        .card_company {
            width: auto;
            height: 400px;
            background-color: #2c47e0;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            
        }

        .card_img {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: cover;
            margin: 0 auto;
            margin-top: -260px;
            border: 7PX double #fff;
            border-radius: 50%;
        }
        .card_nombre {
            display: block;
            text-align: center;
            margin-top: 120px;
            font-size: 35px;
            color: gray;
            padding-bottom: 30px;
        }

        .card_profesion {
            display: block;
            text-align: center;
            margin-top: 5px;
            font-size: 17px;
            color: #9a9c9c;
            letter-spacing: 2;
            padding-bottom:  50px;
            padding-left: -100px;
            padding-right: auto;
        }
        .card_flag {
            width: 150px;
            height: 50px;
            margin: 0 auto;
            background-color: #2c47e0;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding-bottom: -10px;
            text-align: center;
            padding-top: 10px;

        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card_company">
        </div>
        
        <div class="">
            <img class="card_img" src="./retrato.png" alt="">
            <div class="card_nombre">Snoopy <span class="card_nombre--apellido">Dog</span></div>
            <div class="card_profesion">Lorem ipsum dolor sit amet consectetur adipisicing <br>
                elit. Dignissimos odio, consequatur id voluptas <br>
                molestias, ex qui nisi, omnis ipsam magnam veritatis.</div>
            <div class="card_flag">View more</div>
    </div>

</body>
</html>
