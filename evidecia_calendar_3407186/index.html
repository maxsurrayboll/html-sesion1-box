<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styless.css">
    <link rel="stylesheet" href="normalize.css">
    <title>Document</title>
</head>
<body>
    <!-- menu respose flex-->
     <div class="main-header">
        <div class="main-header__container">
            <!--logo-->
            <div class="main-header__logo">
                Calendario de Eventos
            </div>
            <button  class="main-header__toggle" id="menu-toggle">
                    <div class="main-header__bar"></div>
                    <div class="main-header__bar"></div>
                    <div class="main-header__bar"></div>
            </button>
            
         <!--menu principal: se muestra en breackpoins < 500px  -->
         <div class="main-nav" id="main-nav">
            <ul class="main-nav__list">
                <li class="main-nav__item"> <a href="#" class="main-nav__link">Buscar</a></li>
                <li class="main-nav__item"><a href="#" class="main-nav__link">Ayuda</a></li>
                <li class="main-nav__item"><a href="#" class="main-nav__link">Configuracion</a></li>
            </ul>
         </div>
        </div>
        <!-- menu hambuerguesa: toggle menu: se muestra en brackpoins <=500px-->
         
     </div>





    <!-- calendar-->
    <div class="container">
        <div class="month">
            <h2 class="month_name">
                June
            </h2>
        </div>

        <div class="days">
            <div class="days__item">Mon</div>
            <div class="days__item">Tue</div>
            <div class="days__item">Wed</div>
            <div class="days__item">Thu</div>
            <div class="days__item">Fri</div>
            <div class="days__item">Sat</div>
            <div class="days__item">Sun</div>
        </div>
        <div>
            <div class="schedule">
                <div class="schedule__day">1<div class="day-event">festivo</div></div>
                <div class="schedule__day">2</div>
                <div class="schedule__day">3</div>
                <div class="schedule__day">4</div>
                <div class="schedule__day">5</div>
                <div class="schedule__day">6<div class="day-event">cumplealños papa</div></div>
                <div class="schedule__day">7</div>
                <div class="schedule__day">8</div>
                <div class="schedule__day">9</div>
                <div class="schedule__day">10</div>
                <div class="schedule__day">11</div>
                <div class="schedule__day">12</div>
                <div class="schedule__day">13</div>
                <div class="schedule__day">14 <div class="day-event">aseo</div></div>
                <div class="schedule__day">15</div>
                <div class="schedule__day">16</div>
                <div class="schedule__day">17</div>
                <div class="schedule__day">18<div class="day-event">clase</div></div>
                <div class="schedule__day">19</div>
                <div class="schedule__day">20</div>
                <div class="schedule__day">21</div>
                <div class="schedule__day">22</div>
                <div class="schedule__day">23</div>
                <div class="schedule__day">24<div class="day-event">proyecto final entrega</div></div>
                <div class="schedule__day">25</div>
                <div class="schedule__day">26</div>
                <div class="schedule__day">27</div>
                <div class="schedule__day">28</div>
                <div class="schedule__day">29</div>
                <div class="schedule__day">30</div>
            </div>
        </div>
    </div>


    <!-- script para controlar el link-->
    <script>
        
        const MenuToggle = document.getElementById('menu-toggle')
        const mainNav = document.getElementById('main-nav')

        /*añadir el evento click y su funcion*/
        MenuToggle.addEventListener('click' , ()=>{ 
            mainNav.classList.toggle('main-nav__open')
        })

    </script>

</body>
</html>
