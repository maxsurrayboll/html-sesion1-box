<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .elemento{
        display: inline;
         background-color:black;
        color: white;
        width: 200px;
        height: 200px;
        }

        .elemento_block{
            display: block;
            background-color: rgb(31, 45, 73);
            color: rgb(207, 72, 72);
            width: 200px;
            height: 200px;
        }

        .resaltado{
            color: aqua;
            letter-spacing: 2px; 
            font-family: arial;
            font-size: large;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>Inline</h1>

    <div class="elemento resaltado">
        productos
    </div> 
    <div class="elemento">
        sevicios
    </div>
    <div class="elemento">
        contacto
    </div>
        <div class="elemento">
        nosotros
    </div>
    <hr/>
    <h1>Block:</h1>

    <div class="elemento_block">
        productos
    </div> 
    <div class="elemento_block">
        sevicios
    </div>
    <div class="elemento_block">
        contacto
    </div>
    <div class="elemento_block">
        nosotros
    </div>
</body>
</html>
