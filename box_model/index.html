<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .padre {
            width: 500px;
            height: 400px;
            background-color: blueviolet;
            display: block;
        }
        .hijo {
            width: 200px;
            height: 200px;
            background-color: red;
            display: block;
            padding: 20px 30px 10px 5px;
            border-top: 10px double orange;
            border-right: 10px dashed blueviolet;
            border-bottom: 10px solid blue;
            border-left: 5px groove black;
        }
    </style>
</head>
<body>
    <div class="padre">
        <div class="hijo">
            Hijo
        </div>
    </div>
    
</body>
</html>
