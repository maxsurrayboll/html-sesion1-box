<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .padre{
            width: 500px;
            height: 400px;
            background-color: rgb(42, 57, 184);
            display: block;
        }
        .hijo{
            width: 200px;
            height: 200px;
            background-color: aqua;
            padding: 20px 30px 5px 10px;
            border-left: 20px solid rgb(0, 0, 0);
            border-right: 5px dashed rgb(42, 103, 216);
            border-bottom: 3px solid rgb(16, 29, 206);
            border-width: 20px double rgb(227, 231, 1);
        }
    </style>
</head>
<body>
    <div class="padre">
        <div class="hijo">hijo</div>
    </div>
</body>
</html>
